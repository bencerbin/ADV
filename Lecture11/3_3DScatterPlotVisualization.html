<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    #vr-button, #exit-button {
      position: fixed;
      bottom: 20px;
      padding: 15px 30px;
      background-color: #2E3A87;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      z-index: 999;
      cursor: pointer;
    }
    
    #vr-button {
      left: 50%;
      transform: translateX(-50%);
    }
    
    #exit-button {
      right: 20px;
      display: none;
    }
    
    #device-info {
      position: fixed;
      top: 10px;
      left: 10px;
      background-color: rgba(0,0,0,0.5);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      z-index: 999;
    }
    
    #orientation-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-family: sans-serif;
      z-index: 1000;
      display: none;
    }
  </style>
</head>
<body>
  <div id="device-info"></div>
  <div id="orientation-message">
    Please rotate your device to landscape orientation for the best VR experience
    <div style="margin-top: 20px; transform: rotate(90deg); font-size: 24px;">↻</div>
  </div>
  <button id="vr-button">ENTER VR</button>
  <button id="exit-button">EXIT VR</button>
  
  <a-scene>
    <a-sky color="#f0f0f0"></a-sky>
    
    <!-- Camera rig that works for both desktop and VR -->
    <a-entity id="rig" position="0 1.6 5">
      <a-entity id="camera" camera look-controls wasd-controls>
        <a-cursor color="#2E3A87"></a-cursor>
      </a-entity>
    </a-entity>
    
    <!-- Chart title -->
    <a-text value="Comprehensive Product Performance Analysis" position="0 3.2 0" color="#000" align="center" scale="1.5 1.5 1.5"></a-text>
    
    <!-- Axis Labels -->
    <a-entity id="x-axis-label" position="2 -0.4 0">
      <a-text value="Price ($)" color="#000" align="center"></a-text>
    </a-entity>
    
    <a-entity id="y-axis-label" position="-0.4 2 0" rotation="0 0 90">
      <a-text value="Units Sold" color="#000" align="center"></a-text>
    </a-entity>
    
    <a-entity id="z-axis-label" position="0 -0.4 2" rotation="0 90 0">
      <a-text value="Rating" color="#000" align="center"></a-text>
    </a-entity>
    
    <!-- Axes -->
    <a-entity id="x-axis" position="-2 0 0">
      <a-box width="4" height="0.05" depth="0.05" color="#000"></a-box>
    </a-entity>
    
    <a-entity id="y-axis" position="-2 0 0">
      <a-box width="0.05" height="4" depth="0.05" color="#000"></a-box>
    </a-entity>
    
    <a-entity id="z-axis" position="-2 0 0">
      <a-box width="0.05" height="0.05" depth="4" color="#000"></a-box>
    </a-entity>
    
    <!-- Gridlines -->
    <a-entity id="grid-lines">
      <a-box position="-2 0 -2" width="4" height="0.01" depth="4" color="#888" opacity="0.3"></a-box>
      <a-box position="-2 2 -2" width="4" height="0.01" depth="4" color="#888" opacity="0.3"></a-box>
      <a-box position="-2 4 -2" width="4" height="0.01" depth="4" color="#888" opacity="0.3"></a-box>
    </a-entity>
    
    <!-- Data points container -->
    <a-entity id="data-points"></a-entity>
    
    <!-- Info panel -->
    <a-entity id="infoPanel" position="0 1.6 -2" visible="false" scale="0.75 0.75 0.75">
      <a-plane width="2" height="0.5" color="#FFF" opacity="0.8"></a-plane>
      <a-text id="infoText" value="" align="center" color="#000" position="0 0 0.01" width="2"></a-text>
    </a-entity>
  </a-scene>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Color palette
      const colors = [
        "#4285F4", "#EA4335", "#FBBC05", "#34A853", 
        "#FF6B6B", "#4ECDC4", "#45B7D1", "#FDCB6E", 
        "#6C5CE7", "#FF8A5B", "#2ECC71", "#3498DB"
      ];

      // Product categories
      const categories = [
        "Electronics", "Computers", "Smartphones", "Wearables", 
        "Home Appliances", "Gaming", "Audio", "Cameras"
      ];

      // Function to generate random product name
      function generateProductName(category) {
        const prefixes = ["Ultra", "Pro", "Elite", "Smart", "Advanced", "Premium"];
        const models = ["X", "Plus", "Max", "Lite", "Go", "Edge"];
        return `${prefixes[Math.floor(Math.random() * prefixes.length)]} ${category} ${models[Math.floor(Math.random() * models.length)]}`;
      }

      // Generate a large dataset
      const productData = [];
      
      // Generate multiple products for each category
      for (let i = 0; i < 50; i++) {
        // Randomize product attributes with some logical constraints
        const category = categories[Math.floor(Math.random() * categories.length)];
        const price = Math.floor(Math.random() * 200) + 10; // $10 to $210
        const units = Math.floor(Math.random() * 200) + 10; // 10 to 210 units
        const rating = (Math.random() * 3) + 2; // 2.0 to 5.0 rating
        
        productData.push({
          name: generateProductName(category),
          category: category,
          price: price,
          units: units,
          rating: Number(rating.toFixed(1)),
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      
      // Function to normalize data for 3D visualization
      function normalizeData(data, key) {
        const values = data.map(item => item[key]);
        const min = Math.min(...values);
        const max = Math.max(...values);
        return values.map(val => ((val - min) / (max - min)) * 4);
      }
      
      // Normalize each dimension
      const normalizedPrices = normalizeData(productData, 'price');
      const normalizedUnits = normalizeData(productData, 'units');
      const normalizedRatings = normalizeData(productData, 'rating');
      
      // Get data points container
      const dataPointsContainer = document.getElementById('data-points');
      const infoPanel = document.getElementById('infoPanel');
      const infoText = document.getElementById('infoText');
      
      // Create data points dynamically
      productData.forEach((product, index) => {
        // Create sphere for each data point
        const sphere = document.createElement('a-sphere');
        
        // Position calculation (subtract 2 to center around origin)
        sphere.setAttribute('position', `${normalizedPrices[index] - 2} ${normalizedUnits[index]} ${normalizedRatings[index] - 2}`);
        
        // Styling
        sphere.setAttribute('radius', '0.1');
        sphere.setAttribute('color', product.color);
        sphere.classList.add('datapoint');
        
        // Hover interactions
        sphere.innerHTML = `
          <a-animation begin="mouseenter" attribute="material.opacity" from="1" to="0.5" dur="300"></a-animation>
          <a-animation begin="mouseleave" attribute="material.opacity" from="0.5" to="1" dur="300"></a-animation>
        `;
        
        // Data attributes for info display
        sphere.setAttribute('data-info', 
          `${product.name}\nCategory: ${product.category}\nPrice: $${product.price}\nUnits: ${product.units}\nRating: ${product.rating}★`
        );
        
        // Add event listeners for info display
        sphere.addEventListener('mouseenter', function() {
          const info = this.getAttribute('data-info');
          infoText.setAttribute('value', info);
          infoPanel.setAttribute('visible', true);
        });
        
        sphere.addEventListener('mouseleave', function() {
          infoPanel.setAttribute('visible', false);
        });
        
        // Add to container
        dataPointsContainer.appendChild(sphere);
      });
      
      // VR and device mode logic
      const vrButton = document.getElementById('vr-button');
      const exitButton = document.getElementById('exit-button');
      const deviceInfo = document.getElementById('device-info');
      const orientationMessage = document.getElementById('orientation-message');
      const scene = document.querySelector('a-scene');
      const camera = document.getElementById('camera');
      
      // Check device and set up appropriate mode
      const isMobile = AFRAME.utils.device.isMobile();
      const isDesktop = !isMobile;
      
      // Function to check and handle orientation
      function checkOrientation() {
        // Only relevant for mobile
        if (!isMobile) return;
        
        // Check if in portrait mode (height > width)
        const isPortrait = window.innerHeight > window.innerWidth;
        
        if (isPortrait) {
          orientationMessage.style.display = 'block';
        } else {
          orientationMessage.style.display = 'none';
        }
      }
      
      // Set up orientation checking
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      
      // Initial orientation check
      checkOrientation();
      
      // Configure for desktop mode if needed
      if (isDesktop) {
        deviceInfo.textContent = "Desktop Mode - Use mouse to look around or enter VR with a compatible headset";
        vrButton.textContent = "ENTER VR (DESKTOP)";
      } else {
        deviceInfo.textContent = "Mobile Device Detected - Click ENTER VR for immersive view";
      }
      
      // Function to force landscape orientation
      function forceLandscapeOrientation() {
        if (isMobile) {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape-primary')
              .then(() => {
                console.log('Orientation locked to landscape');
              })
              .catch(error => {
                console.error('Orientation lock failed: ', error);
                // Show manual orientation message if locking fails
                checkOrientation();
              });
          } else if (screen.lockOrientation) {
            // Older API
            screen.lockOrientation('landscape');
          } else if (screen.mozLockOrientation) {
            screen.mozLockOrientation('landscape');
          } else if (screen.msLockOrientation) {
            screen.msLockOrientation('landscape');
          } else {
            // Can't lock programmatically, show message
            checkOrientation();
          }
        }
      }
      
      // Function to release orientation lock
      function releaseOrientationLock() {
        if (isMobile) {
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
            console.log('Orientation lock released');
          }
        }
      }
      
      // VR button functionality
      vrButton.addEventListener('click', function() {
        // First force landscape orientation
        forceLandscapeOrientation();
        
        // Wait a moment for orientation to change
        setTimeout(() => {
          // Then try to enter VR
          scene.enterVR();
          vrButton.style.display = 'none';
          exitButton.style.display = 'block';
          deviceInfo.style.display = 'none';
          orientationMessage.style.display = 'none';
        }, 500);
      });
      
      // Exit button functionality
      exitButton.addEventListener('click', function() {
        scene.exitVR();
        exitButton.style.display = 'none';
        vrButton.style.display = 'block';
        deviceInfo.style.display = 'block';
        
        // Release orientation lock
        releaseOrientationLock();
        
        // Force exit fullscreen if needed
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      });
      
      // Scene VR mode change events
      scene.addEventListener('enter-vr', function() {
        console.log('Entered VR mode');
        exitButton.style.display = 'block';
        vrButton.style.display = 'none';
      });
      
      scene.addEventListener('exit-vr', function() {
        console.log('Exited VR mode');
        exitButton.style.display = 'none';
        vrButton.style.display = 'block';
        
        // Release orientation lock when exiting VR
        releaseOrientationLock();
      });
    });
  </script>
</body>
</html>
