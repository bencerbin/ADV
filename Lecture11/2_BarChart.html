<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* Ensure the VR button is visible */
    .a-enter-vr {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 9999 !important;
      opacity: 1 !important;
      display: block !important;
      visibility: visible !important;
    }
    
    .a-enter-vr-button {
      background-color: #2E3A87 !important; /* Match the bar chart blue */
      border: 2px solid white !important;
    }
  </style>
</head>
<body>
  <a-scene>
    <a-sky color="#f0f0f0"></a-sky>
    
    <!-- Using a rig to make position adjustments easier -->
    <a-entity id="rig" position="0 1.6 4">
      <a-entity id="camera" camera look-controls>
        <a-cursor color="#2E3A87"></a-cursor>
      </a-entity>
    </a-entity>
    
    <!-- Chart title -->
    <a-text value="Monthly Sales Data" position="0 3.2 0" color="#000" align="center" scale="1.5 1.5 1.5"></a-text>
    
    <!-- X-axis -->
    <a-entity position="-3 0 0">
      <a-box width="6" height="0.05" depth="0.05" color="#000"></a-box>
      
      <!-- X-axis labels -->
      <a-text value="Jan" position="0 -0.3 0" color="#000" align="center"></a-text>
      <a-text value="Feb" position="1 -0.3 0" color="#000" align="center"></a-text>
      <a-text value="Mar" position="2 -0.3 0" color="#000" align="center"></a-text>
      <a-text value="Apr" position="3 -0.3 0" color="#000" align="center"></a-text>
      <a-text value="May" position="4 -0.3 0" color="#000" align="center"></a-text>
      <a-text value="Jun" position="5 -0.3 0" color="#000" align="center"></a-text>
    </a-entity>
    
    <!-- Y-axis -->
    <a-entity position="-3 0 0">
      <a-box width="0.05" height="3" depth="0.05" color="#000"></a-box>
      
      <!-- Y-axis labels -->
      <a-text value="0" position="-0.3 0 0" color="#000" align="right"></a-text>
      <a-text value="25" position="-0.3 0.75 0" color="#000" align="right"></a-text>
      <a-text value="50" position="-0.3 1.5 0" color="#000" align="right"></a-text>
      <a-text value="75" position="-0.3 2.25 0" color="#000" align="right"></a-text>
      <a-text value="100" position="-0.3 3 0" color="#000" align="right"></a-text>
    </a-entity>
    
    <!-- Data bars -->
    <a-entity position="-3 0 0">
      <a-box id="jan" position="0 1.2 0" width="0.5" height="2.4" depth="0.5" color="#4285F4">
        <a-animation begin="mouseenter" attribute="material.opacity" from="1" to="0.5" dur="300"></a-animation>
        <a-animation begin="mouseleave" attribute="material.opacity" from="0.5" to="1" dur="300"></a-animation>
        <a-text value="80" position="0 1.3 0.3" color="#FFF" align="center"></a-text>
      </a-box>
      
      <a-box id="feb" position="1 0.9 0" width="0.5" height="1.8" depth="0.5" color="#EA4335">
        <a-animation begin="mouseenter" attribute="material.opacity" from="1" to="0.5" dur="300"></a-animation>
        <a-animation begin="mouseleave" attribute="material.opacity" from="0.5" to="1" dur="300"></a-animation>
        <a-text value="60" position="0 1 0.3" color="#FFF" align="center"></a-text>
      </a-box>
      
      <a-box id="mar" position="2 1.35 0" width="0.5" height="2.7" depth="0.5" color="#FBBC05">
        <a-animation begin="mouseenter" attribute="material.opacity" from="1" to="0.5" dur="300"></a-animation>
        <a-animation begin="mouseleave" attribute="material.opacity" from="0.5" to="1" dur="300"></a-animation>
        <a-text value="90" position="0 1.4 0.3" color="#FFF" align="center"></a-text>
      </a-box>
      
      <a-box id="apr" position="3 0.75 0" width="0.5" height="1.5" depth="0.5" color="#34A853">
        <a-animation begin="mouseenter" attribute="material.opacity" from="1" to="0.5" dur="300"></a-animation>
        <a-animation begin="mouseleave" attribute="material.opacity" from="0.5" to="1" dur="300"></a-animation>
        <a-text value="50" position="0 0.8 0.3" color="#FFF" align="center"></a-text>
      </a-box>
      
      <a-box id="may" position="4 1.05 0" width="0.5" height="2.1" depth="0.5" color="#4285F4">
        <a-animation begin="mouseenter" attribute="material.opacity" from="1" to="0.5" dur="300"></a-animation>
        <a-animation begin="mouseleave" attribute="material.opacity" from="0.5" to="1" dur="300"></a-animation>
        <a-text value="70" position="0 1.1 0.3" color="#FFF" align="center"></a-text>
      </a-box>
      
      <a-box id="jun" position="5 1.65 0" width="0.5" height="3.3" depth="0.5" color="#EA4335">
        <a-animation begin="mouseenter" attribute="material.opacity" from="1" to="0.5" dur="300"></a-animation>
        <a-animation begin="mouseleave" attribute="material.opacity" from="0.5" to="1" dur="300"></a-animation>
        <a-text value="110" position="0 1.7 0.3" color="#FFF" align="center"></a-text>
      </a-box>
    </a-entity>
  </a-scene>
  
  <script>
    // Wait for the scene to load
    document.querySelector('a-scene').addEventListener('loaded', function () {
      const rig = document.getElementById('rig');
      const scene = document.querySelector('a-scene');
      
      // Store original position for restoration when exiting VR
      const originalPosition = rig.getAttribute('position');
      
      // When entering VR mode, move the camera further back
      scene.addEventListener('enter-vr', function () {
        // Move the rig back to 8 units from the graph (further back)
        rig.setAttribute('position', {x: 0, y: 1.6, z: 8});
      });
      
      // When exiting VR mode, restore the original camera position
      scene.addEventListener('exit-vr', function () {
        // Restore original position (4 units from the graph)
        rig.setAttribute('position', originalPosition);
      });
    });
  </script>
</body>
</html>
