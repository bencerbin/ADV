<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Natural Gestures for Data Filtering</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  
  <style>
    .control-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      z-index: 999;
      display: flex;
      flex-wrap: wrap;
      max-width: 80vw;
    }
    
    button {
      background-color: #ff4081;
      border: none;
      color: white;
      padding: 8px 12px;
      text-align: center;
      font-size: 14px;
      margin: 3px;
      cursor: pointer;
      border-radius: 5px;
    }
    
    .info-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      max-width: 300px;
      max-height: 40vh;
      overflow-y: auto;
      z-index: 999;
      transition: opacity 0.3s ease;
      font-size: 14px;
    }
    
    .info-panel.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .info-panel h2 {
      margin-top: 0;
      color: #ff4081;
      font-size: 16px;
    }
    
    /* Mobile optimizations */
    @media (max-width: 768px) {
      .info-panel {
        max-width: 80vw;
        max-height: 30vh;
        font-size: 12px;
      }
      
      .info-panel h2 {
        font-size: 14px;
        margin-bottom: 5px;
      }
      
      button {
        padding: 6px 10px;
        font-size: 12px;
      }
    }
    
    .toggle-info {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #ff4081;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      z-index: 1000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Toggle button for info panel -->
  <button class="toggle-info" id="toggle-info">i</button>
  
  <!-- Info Panel -->
  <div class="info-panel" id="info-panel">
    <h2>Natural Gestures for Data Filtering</h2>
    <p>This example demonstrates using gestures to filter data:</p>
    <ul>
      <li><strong>Pinch:</strong> Use two fingers to pinch in or out to filter data</li>
      <li><strong>Tap 'i':</strong> Toggle this info panel</li>
    </ul>
    <p><strong>Visible data stats:</strong> <span id="stats-display">Loading...</span></p>
  </div>

  <!-- Button Controls (fallback for non-touch devices) -->
  <div class="control-panel">
    <button id="zoom-in-btn">Pinch In</button>
    <button id="zoom-out-btn">Pinch Out</button>
    <button id="reset-btn">Reset</button>
  </div>

  <!-- A-Frame Scene -->
  <a-scene vr-mode-ui="enabled: false">
    <!-- Camera positioned at origin looking forward -->
    <a-entity position="0 1.6 5">
      <a-camera wasd-controls look-controls></a-camera>
    </a-entity>
    
    <!-- Minimalistic filter range indicator -->
    <a-entity id="filter-indicator" position="0 3.2 0" text="value: Filtering...; width: 4; color: white; align: center; wrapCount: 30;"></a-entity>
    
    <!-- Grid for reference -->
    <a-grid color="#444" position="0 -1 0"></a-grid>
    
    <!-- Axes for reference -->
    <a-entity id="axes" position="0 0 0">
      <a-box position="2.5 0 0" scale="5 0.1 0.1" color="#FF5555"></a-box>
      <a-box position="0 2.5 0" scale="0.1 5 0.1" color="#55FF55"></a-box>
      <a-box position="0 0 2.5" scale="0.1 0.1 5" color="#5555FF"></a-box>
      
      <a-text value="X" position="5.2 0 0" color="red" scale="1.5 1.5 1.5"></a-text>
      <a-text value="Y" position="0 5.2 0" color="green" scale="1.5 1.5 1.5"></a-text>
      <a-text value="Z" position="0 0 5.2" color="blue" scale="1.5 1.5 1.5"></a-text>
    </a-entity>
    
    <!-- Container for data points -->
    <a-entity id="data-container"></a-entity>
    
    <!-- Light -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="1 1 1" intensity="0.6"></a-light>
    
    <!-- Sky background -->
    <a-sky color="#222"></a-sky>
  </a-scene>

  <script>
    // Filter state
    const filters = {
      xRange: [0, 100],
      yRange: [0, 100],
      zRange: [0, 100]
    };
    
    // Data points array to store references
    const dataPoints = [];
    
    // Touch gesture handling variables
    let touchStartDistance = 0;
    let isMultiTouch = false;
    
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', function() {
      // Wait for scene to be loaded
      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', initializeVisualization);
      
      // Set up info panel toggle
      document.getElementById('toggle-info').addEventListener('click', toggleInfoPanel);
    });
    
    // Toggle info panel visibility
    function toggleInfoPanel() {
      const infoPanel = document.getElementById('info-panel');
      infoPanel.classList.toggle('hidden');
    }
    
    // Set up the visualization
    function initializeVisualization() {
      console.log('Initializing visualization');
      
      // Create interesting data clusters
      createDataVisualization();
      
      // Set up touch gesture handlers
      setupTouchGestures();
      
      // Set up button handlers (fallback for non-touch devices)
      document.getElementById('zoom-in-btn').addEventListener('click', function() {
        narrowFilterRange(0.15);
        applyFilters();
      });
      
      document.getElementById('zoom-out-btn').addEventListener('click', function() {
        expandFilterRange(0.15);
        applyFilters();
      });
      
      document.getElementById('reset-btn').addEventListener('click', function() {
        filters.xRange = [0, 100];
        filters.yRange = [0, 100];
        filters.zRange = [0, 100];
        applyFilters();
      });
      
      // Initial application of filters
      applyFilters();
    }
    
    // Set up touch gesture handlers
    function setupTouchGestures() {
      const sceneEl = document.querySelector('a-scene');
      
      // Touch start event - store initial finger positions
      sceneEl.addEventListener('touchstart', function(event) {
        if (event.touches.length >= 2) {
          isMultiTouch = true;
          touchStartDistance = calculateTouchDistance(event.touches[0], event.touches[1]);
        }
      });
      
      // Touch move event - calculate pinch and apply filters
      sceneEl.addEventListener('touchmove', function(event) {
        if (isMultiTouch && event.touches.length >= 2) {
          // Prevent default to disable browser pinch zoom
          event.preventDefault();
          
          // Calculate current distance
          const currentDistance = calculateTouchDistance(event.touches[0], event.touches[1]);
          
          // Calculate pinch ratio
          const pinchRatio = currentDistance / touchStartDistance;
          
          // Apply filter based on pinch direction
          if (Math.abs(pinchRatio - 1) > 0.05) { // Threshold to prevent tiny adjustments
            if (pinchRatio < 1) {
              // Pinch in - narrow filter
              narrowFilterRange(0.05);
              applyFilters();
            } else {
              // Pinch out - expand filter
              expandFilterRange(0.05);
              applyFilters();
            }
            
            // Update start distance for next move
            touchStartDistance = currentDistance;
          }
        }
      });
      
      // Touch end event - reset multi-touch flag
      sceneEl.addEventListener('touchend', function() {
        isMultiTouch = false;
      });
      
      // Touch cancel event - reset multi-touch flag
      sceneEl.addEventListener('touchcancel', function() {
        isMultiTouch = false;
      });
    }
    
    // Calculate distance between two touch points
    function calculateTouchDistance(touch1, touch2) {
      const dx = touch1.clientX - touch2.clientX;
      const dy = touch1.clientY - touch2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    
    // Create an interesting data visualization
    function createDataVisualization() {
      const container = document.getElementById('data-container');
      
      // Create three clusters of data plus some random noise
      createDataCluster(container, -3, 2, -2, 30, 'temperature', dataPoints); // Temperature cluster
      createDataCluster(container, 3, -1, 2, 30, 'pressure', dataPoints);    // Pressure cluster
      createDataCluster(container, 0, -2, -4, 30, 'humidity', dataPoints);   // Humidity cluster
      createNoise(container, 60, dataPoints);                               // Random noise
      
      console.log(`Created a total of ${dataPoints.length} data points`);
    }
    
    // Create a cluster of related data points
    function createDataCluster(container, centerX, centerY, centerZ, count, type, pointsArray) {
      const clusterRadius = 2;
      
      // Map cluster centers to data space (0-100)
      const dataX = (centerX + 5) * 10; // Map from -5,5 to 0,100
      const dataY = (centerY + 5) * 10;
      const dataZ = (centerZ + 5) * 10;
      
      for (let i = 0; i < count; i++) {
        // Create point with gaussian distribution around center
        let pointX = centerX + (Math.random() + Math.random() + Math.random() - 1.5) * clusterRadius;
        let pointY = centerY + (Math.random() + Math.random() + Math.random() - 1.5) * clusterRadius;
        let pointZ = centerZ + (Math.random() + Math.random() + Math.random() - 1.5) * clusterRadius;
        
        // Map to data space (0-100 scale)
        const dataPointX = (pointX + 5) * 10;
        const dataPointY = (pointY + 5) * 10;
        const dataPointZ = (pointZ + 5) * 10;
        
        // Determine color and size based on type
        let color, size;
        if (type === 'temperature') {
          color = `rgb(${200 + Math.random() * 55}, ${100 + Math.random() * 50}, ${100 + Math.random() * 50})`;
          size = 0.2 + Math.random() * 0.2;
        } else if (type === 'pressure') {
          color = `rgb(${100 + Math.random() * 50}, ${100 + Math.random() * 50}, ${200 + Math.random() * 55})`;
          size = 0.15 + Math.random() * 0.25;
        } else { // humidity
          color = `rgb(${100 + Math.random() * 50}, ${200 + Math.random() * 55}, ${100 + Math.random() * 50})`;
          size = 0.25 + Math.random() * 0.15;
        }
        
        // Create the sphere entity
        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('position', { x: pointX, y: pointY, z: pointZ });
        sphere.setAttribute('radius', size);
        sphere.setAttribute('color', color);
        sphere.setAttribute('material', 'emissive: #222; metalness: 0.3; roughness: 0.7');
        
        // Store data values
        sphere.dataset.x = dataPointX;
        sphere.dataset.y = dataPointY;
        sphere.dataset.z = dataPointZ;
        sphere.dataset.type = type;
        sphere.dataset.originalSize = size;
        
        // Add to container and store reference
        container.appendChild(sphere);
        pointsArray.push(sphere);
      }
    }
    
    // Create random noise points
    function createNoise(container, count, pointsArray) {
      for (let i = 0; i < count; i++) {
        // Random position in scene
        const pointX = (Math.random() * 10) - 5;
        const pointY = (Math.random() * 10) - 5;
        const pointZ = (Math.random() * 10) - 5;
        
        // Map to data space
        const dataPointX = (pointX + 5) * 10;
        const dataPointY = (pointY + 5) * 10;
        const dataPointZ = (pointZ + 5) * 10;
        
        // Random size and color
        const size = 0.1 + Math.random() * 0.1;
        const brightness = 100 + Math.random() * 155;
        const color = `rgb(${brightness}, ${brightness}, ${brightness})`;
        
        // Create sphere
        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('position', { x: pointX, y: pointY, z: pointZ });
        sphere.setAttribute('radius', size);
        sphere.setAttribute('color', color);
        sphere.setAttribute('material', 'emissive: #111');
        
        // Store data values
        sphere.dataset.x = dataPointX;
        sphere.dataset.y = dataPointY;
        sphere.dataset.z = dataPointZ;
        sphere.dataset.type = 'noise';
        sphere.dataset.originalSize = size;
        
        // Add to container and store reference
        container.appendChild(sphere);
        pointsArray.push(sphere);
      }
    }
    
    // Narrow the filter range
    function narrowFilterRange(amount) {
      // Calculate current range sizes
      const xSize = filters.xRange[1] - filters.xRange[0];
      const ySize = filters.yRange[1] - filters.yRange[0];
      const zSize = filters.zRange[1] - filters.zRange[0];
      
      // Calculate center points
      const xCenter = (filters.xRange[0] + filters.xRange[1]) / 2;
      const yCenter = (filters.yRange[0] + filters.yRange[1]) / 2;
      const zCenter = (filters.zRange[0] + filters.zRange[1]) / 2;
      
      // Calculate new range sizes
      const newXSize = xSize * (1 - amount);
      const newYSize = ySize * (1 - amount);
      const newZSize = zSize * (1 - amount);
      
      // Set new ranges, centered on current center
      if (xSize > 10) { // Prevent complete collapse
        filters.xRange[0] = Math.max(0, xCenter - newXSize / 2);
        filters.xRange[1] = Math.min(100, xCenter + newXSize / 2);
      }
      
      if (ySize > 10) {
        filters.yRange[0] = Math.max(0, yCenter - newYSize / 2);
        filters.yRange[1] = Math.min(100, yCenter + newYSize / 2);
      }
      
      if (zSize > 10) {
        filters.zRange[0] = Math.max(0, zCenter - newZSize / 2);
        filters.zRange[1] = Math.min(100, zCenter + newZSize / 2);
      }
    }
    
    // Expand the filter range
    function expandFilterRange(amount) {
      // Calculate current range sizes
      const xSize = filters.xRange[1] - filters.xRange[0];
      const ySize = filters.yRange[1] - filters.yRange[0];
      const zSize = filters.zRange[1] - filters.zRange[0];
      
      // Calculate center points
      const xCenter = (filters.xRange[0] + filters.xRange[1]) / 2;
      const yCenter = (filters.yRange[0] + filters.yRange[1]) / 2;
      const zCenter = (filters.zRange[0] + filters.zRange[1]) / 2;
      
      // Calculate new range sizes
      const newXSize = xSize * (1 + amount);
      const newYSize = ySize * (1 + amount);
      const newZSize = zSize * (1 + amount);
      
      // Set new ranges, centered on current center
      filters.xRange[0] = Math.max(0, xCenter - newXSize / 2);
      filters.xRange[1] = Math.min(100, xCenter + newXSize / 2);
      
      filters.yRange[0] = Math.max(0, yCenter - newYSize / 2);
      filters.yRange[1] = Math.min(100, yCenter + newYSize / 2);
      
      filters.zRange[0] = Math.max(0, zCenter - newZSize / 2);
      filters.zRange[1] = Math.min(100, zCenter + newZSize / 2);
    }
    
    // Apply filters to data points
    function applyFilters() {
      let visibleCount = 0;
      let totalCount = dataPoints.length;
      
      // Count visible points by type
      const typeCounts = {
        temperature: 0,
        pressure: 0,
        humidity: 0,
        noise: 0
      };
      
      // Apply filters to each point
      dataPoints.forEach(point => {
        const x = parseFloat(point.dataset.x);
        const y = parseFloat(point.dataset.y);
        const z = parseFloat(point.dataset.z);
        const type = point.dataset.type;
        const originalSize = parseFloat(point.dataset.originalSize);
        
        // Check if point is within filter ranges
        const isVisible = 
          x >= filters.xRange[0] && x <= filters.xRange[1] &&
          y >= filters.yRange[0] && y <= filters.yRange[1] &&
          z >= filters.zRange[0] && z <= filters.zRange[1];
        
        if (isVisible) {
          visibleCount++;
          typeCounts[type]++;
          
          // Calculate centrality within filter range
          const xPos = (x - filters.xRange[0]) / (filters.xRange[1] - filters.xRange[0]);
          const yPos = (y - filters.yRange[0]) / (filters.yRange[1] - filters.yRange[0]);
          const zPos = (z - filters.zRange[0]) / (filters.zRange[1] - filters.zRange[0]);
          
          // Calculate distance from center (0.5, 0.5, 0.5) in normalized space
          const xDist = Math.abs(xPos - 0.5);
          const yDist = Math.abs(yPos - 0.5);
          const zDist = Math.abs(zPos - 0.5);
          
          // Overall centrality (1 = center, 0 = edge)
          const centrality = 1 - Math.sqrt(xDist*xDist + yDist*yDist + zDist*zDist) / 0.866; // √3/2
          
          // Make central points bigger and brighter
          point.setAttribute('visible', true);
          point.setAttribute('radius', originalSize * (1 + centrality * 0.5));
          
          // Adjust opacity based on centrality
          const material = point.getAttribute('material') || {};
          material.opacity = 0.7 + (centrality * 0.3);
          point.setAttribute('material', material);
          
          // Add pulsing animation to points near center
          if (centrality > 0.8) {
            if (!point.hasAttribute('animation')) {
              point.setAttribute('animation', {
                property: 'radius',
                dur: 1000 + Math.random() * 1000,
                from: originalSize * 1.3,
                to: originalSize * 1.6,
                dir: 'alternate',
                loop: true,
                easing: 'easeInOutSine'
              });
            }
          } else {
            point.removeAttribute('animation');
          }
        } else {
          point.setAttribute('visible', false);
          point.removeAttribute('animation');
        }
      });
      
      // Update filter display
      updateFilterDisplay(visibleCount, totalCount, typeCounts);
    }
    
    // Update the filter info display
    function updateFilterDisplay(visibleCount, totalCount, typeCounts) {
      // Update the minimal on-screen indicator
      const filterIndicator = document.getElementById('filter-indicator');
      filterIndicator.setAttribute('text', {
        value: `Filter: X[${filters.xRange[0].toFixed(0)}-${filters.xRange[1].toFixed(0)}] Y[${filters.yRange[0].toFixed(0)}-${filters.yRange[1].toFixed(0)}] Z[${filters.zRange[0].toFixed(0)}-${filters.zRange[1].toFixed(0)}]`,
        width: 4,
        color: 'white',
        align: 'center'
      });
      
      // Update stats in the info panel
      const statsDisplay = document.getElementById('stats-display');
      if (statsDisplay) {
        statsDisplay.textContent = `${visibleCount}/${totalCount} (${Math.round(visibleCount/totalCount*100)}%)
Temperature: ${typeCounts.temperature}, Pressure: ${typeCounts.pressure}, Humidity: ${typeCounts.humidity}`;
      }
    }
  </script>
</body>
</html>
