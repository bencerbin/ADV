<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Environment -->
      <a-sky color="#ECECEC"></a-sky>
      
      <!-- 3D objects -->
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -10" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
	  
	  <!-- Entity with multiple components -->
		<a-entity
		  geometry="primitive: box; width: 2; height: 0.5; depth: 1"
		  material="color: #FF6B6B; roughness: 0.7; metalness: 0.2"
		  position="0 1 -4"
		  rotation="0 45 0"
		  animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
		  shadow="cast: true; receive: true"
		>
		  <!-- Nested entity -->
		  <a-entity
			text="value: Data Point; align: center; width: 4"
			position="0 0.5 0"
		  ></a-entity>
		</a-entity>
      
      <!-- Camera and controls -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
