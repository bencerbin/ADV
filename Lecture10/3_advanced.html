<!DOCTYPE html>
<html>
<head>
    <title>Interactive Data Filtering in VR</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="js/advanced.js"></script>
    <style>
        body { margin: 0; }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">Loading VR Experience...</div>
    
    <a-scene>
        <!-- Camera and cursor -->
        <a-entity position="0 1.6 2">
            <a-camera look-controls>
                <a-cursor
                    raycaster="objects: .clickable"
                    material="color: white; shader: flat"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02">
                </a-cursor>
            </a-camera>
        </a-entity>

        <!-- Filter controls container -->
        <a-entity id="filterControlsContainer" position="-1 1.6 -2">
            <a-entity
                filter-controls
                position="0 0 0"
                class="clickable">
            </a-entity>
        </a-entity>

        <!-- Data visualization container -->
        <a-entity id="dataContainer" position="1 1.6 -2"></a-entity>

        <!-- Environment -->
        <a-sky color="#1a1a1a"></a-sky>
        <a-grid material="color: #333"></a-grid>
        
        <!-- Lighting -->
        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" position="-1 1 0" intensity="0.8"></a-light>
    </a-scene>
</body>
</html>
