<!DOCTYPE html>
<html>
  <head>
    <title>Basic AR.js Example</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="js/2_marker.js"></script>
    <style>
      .ar-info {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        z-index: 1000;
        pointer-events: none;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="ar-info">Point camera at Hiro marker</div>
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Marker definition -->
      <a-marker preset="hiro" ar-marker>
        <!-- Base platform -->
        <a-entity
          position = "0 0 0"
          rotation ="270 0 0"
          scale = "1 1 1"
          gltf-model ="Untitled.glb">
        </a-entity>
      </a-marker>
      
      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
